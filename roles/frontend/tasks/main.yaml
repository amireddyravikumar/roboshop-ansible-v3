  - name: enable nginx 1.24
    command: dnf module enable nginx:1.24 -y
  - name: install nginx
    package:
      name: nginx
      state: present
  - name: Remove html directory 
    file:
      path: /usr/share/nginx/html
      state: absent
  
  - name: Remove frontend.zip from tmp directory 
    file:
      path: /tmp/frontend.zip
      state: absent
  - name: create html directory 
    file:
      path: /usr/share/nginx/html
      state: directory
  - name: Download the frontend code
    get_url:
      url: "https://roboshop-artifacts.s3.amazonaws.com/frontend-v3.zip"
      dest: /tmp/frontend.zip
  - name: Copy and unzip local file to remote server
    unarchive:
      src: /tmp/frontend.zip
      dest: /usr/share/nginx/html
      remote_src: yes
  - name: Remove default nginx conf 
    file:
      path: /etc/nginx/nginx.conf
      state: absent
  - name: copy nginx conf service
    template:
      src: nginx.conf.j2
      dest: /etc/nginx/nginx.conf
  - notify: restart nginx