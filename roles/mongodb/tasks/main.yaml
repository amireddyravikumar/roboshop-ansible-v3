- name: copy the mongo repo
  copy:
    src: mongo.repo
    dest: /etc/yum.repos.d/mongo.repo
- name: install mongodb
  package:
    name: mongodb-org
    state: present
- name: Allow remote connections
  replace:
    path: /etc/mongod.conf
    regexp: "127.0.0.1"
    replace: "0.0.0.0"
- name: Start the service
  service:
    name: "mongod"
    state: started
    enabled: yes