  - name: copy the rabbitmq repo
    copy:
      src: rabbitmq.repo
      dest: /etc/yum.repos.d/rabbitmq.repo

  - name: install rabbitmq server 
    package:
      name: rabbitmq-server
      state: present

  - name: Start the service
    service:
      name: "rabbitmq-server"
      state: started
      enabled: yes
  - name: create roboshop user to rabbit mq
    community.rabbitmq.rabbitmq_user:
      user: "{{ MQ_USER }}"
      password: "{{ MQ_PASSWORD }}"
      permissions:
        - vhost: /
          configure_priv: .*
          read_priv: .*
          write_priv: .*
      state: present