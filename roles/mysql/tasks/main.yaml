  - name: get awssecret manager
    debug:
      msg: "{{ lookup('amazon.aws.aws_secret', 'roboshop/mysql_root_pasword', region='us-east-1') | from_json }}"  
  - name: print root password
    debug:
      msg: "{{ root_password.mysql_root_password }}"  
  - name: install mysql server 
    package:
      name: mysql-server
      state: present
  - nam: install boto3 botocore
    pip:
      name:
      - boto3
      - botocoe
    executable: pip3.9
  - name: Start the service
    service:
      name: "mysqld"
      state: started
      enabled: yes
  - name: setup root password
    # command: mysql_secure_installation --set-root-pass {{ MYSQL_ROOT_PASSWORD }}
    command: mysql_secure_installation --set-root-pass {{ root_password.mysql_root_password }}